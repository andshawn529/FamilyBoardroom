name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Initialize Capacitor Project
        run: |
          npx cap init "Family Boardroom" com.familyboardroom.app --web-dir . --yes
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-boardroom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
